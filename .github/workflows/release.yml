# Builds Vigil for macOS, Windows and Linux when a v* tag (v0.1.0 and so on) is pushed, and uploads the installers
# and the update feeds (latest*.yml) to a draft GitHub Release. Publish the draft to ship it: the download page on
# guildbook.io/vigil and the apps' auto-updater only see published releases.
#
# Signing is optional. Each platform signs when its secrets are set and builds unsigned otherwise (see README,
# "Releasing"). The release notes get a marker saying which builds are signed, which the download page
# reads to decide whether to explain Gatekeeper and SmartScreen.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package."
            exit 1
          fi
      - name: Create the draft (notes from the annotated tag message, if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          [ -n "$notes" ] || notes="Vigil ${GITHUB_REF_NAME#v}."
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Vigil ${GITHUB_REF_NAME#v}" --notes "$notes"

  build:
    name: Build (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
            cache: ~/Library/Caches
          - platform: windows
            os: windows-latest
            cache: ~/AppData/Local
          - platform: linux
            os: ubuntu-latest
            cache: ~/.cache
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.cache }}/electron
            ${{ matrix.cache }}/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Write the App Store Connect API key
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # macOS: Developer ID Application certificate, then notarization with an API key or an Apple ID.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing, or a .pfx certificate.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          node scripts/signing.cjs ${{ matrix.platform }} > signing-${{ matrix.platform }}.txt
          pnpm release --${{ matrix.platform == 'windows' && 'win' || matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: signing-${{ matrix.platform }}
          path: signing-${{ matrix.platform }}.txt

  notes:
    name: Record signing in the release notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signing-*
          merge-multiple: true
          path: signing
      - name: Add the signing marker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker="<!-- vigil-signing: $(cat signing/*.txt | tr '\n' ' ' | xargs) -->"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body | sed '/<!-- vigil-signing:/d' > notes.md
          printf '\n%s\n' "$marker" >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Draft ready: $marker"
